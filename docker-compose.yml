services:
  web:
    build: .
    environment:
      PORT: 4173
      DATABASE_URL: postgresql://referralforge:referralforge@postgres:5432/referralforge
      REDIS_URL: redis://redis:6379
    ports:
      - "4173:4173"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: referralforge
      POSTGRES_PASSWORD: referralforge
      POSTGRES_DB: referralforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  validation:
    build: .
    command: ["node", "scripts/validate.mjs"]
    depends_on:
      - postgres
      - redis
volumes:
  postgres-data:
